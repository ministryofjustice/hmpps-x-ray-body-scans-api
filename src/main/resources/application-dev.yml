api:
  hmpps-auth:
    base-url: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
  prison-api:
    base-url: "https://prison-api-dev.prison.service.justice.gov.uk"
  alerts-api:
    base-url: "https://alerts-api-dev.hmpps.service.justice.gov.uk"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
