server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

api:
  hmpps-auth.base-url: http://localhost:8090/auth
  prison-api.base-url: http://localhost:8091
  alerts-api.base-url: http://localhost:8092
  case-notes-api.base-url: http://localhost:8093

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

hmpps:
  sar:
    tests:
      expected-api-response.path: /sar/test-data/expected-api-response.json
      expected-render-result.path: /sar/test-data/expected-render-result.html
      expected-flyway-schema-version: "5"
      expected-jpa-entity-schema.path: /sar/test-data/expected-jpa-entity-schema.json

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
